name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: manmade
            out: out
            web_root_secret: VPS_WEB_ROOT
            rsync_extra: --exclude repos.json
          - app: web
            out: dist
            web_root_secret: VPS_WEB_ROOT_WEB
            rsync_extra: ""
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.MANMADE_SITE_URL }}
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets[matrix.web_root_secret] }}
        run: |
          if [ -z "$SSH_KEY" ] || [ "${TARGET##*:}" = "" ]; then
            echo "::notice::VPS secrets not set; built but skipped upload."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # manmade: repos.json is owned by the server's cron job; never overwrite or delete it.
          rsync -az --delete ${{ matrix.rsync_extra }} \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }}" \
            ${{ matrix.out }}/ "$TARGET/"
