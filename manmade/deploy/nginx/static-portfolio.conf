# nginx server block for the static export (out/).
# Replace example.com and the root path, then:
#   sudo ln -s /etc/nginx/sites-available/static-portfolio.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificate: sudo certbot certonly --webroot -w <root> -d example.com -d www.example.com \
#   --deploy-hook "systemctl reload nginx"   (comment out the ssl lines until it exists)

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name example.com www.example.com;

    root /var/www/static-portfolio;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self'; form-action https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /about -> about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header in a location drops the server-level ones; repeat the essentials.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rewritten daily by cron; let browsers revalidate.
    location = /repos.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}
