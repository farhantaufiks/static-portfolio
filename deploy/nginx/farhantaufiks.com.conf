# Both sites on one VPS, behind Cloudflare (SSL mode: Full).
#   farhantaufiks.com, www  -> web/     (Astro, made with Claude Code)
#   manmade.farhantaufiks.com -> manmade/ (Next.js static export, hand-made)
#
# ACME challenges are served from /var/www/acme for every host, so an
# `rsync --delete` of either site can never break certificate renewal.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farhantaufiks.com www.farhantaufiks.com;

    ssl_certificate /etc/letsencrypt/live/farhantaufiks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farhantaufiks.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/farhantaufiks-web;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Hashed build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manmade.farhantaufiks.com;

    ssl_certificate /etc/letsencrypt/live/farhantaufiks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farhantaufiks.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/static-portofolio;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self'; form-action https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rewritten daily by cron; let browsers revalidate.
    location = /repos.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}
